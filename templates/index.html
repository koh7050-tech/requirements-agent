<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요구사항 분석 에이전트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; background: #f0f2f5; color: #222; }

  header {
    background: linear-gradient(135deg, #1F4E79, #2E75B6);
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  header p  { font-size: .85rem; opacity: .8; margin-top: 2px; }

  .container { max-width: 960px; margin: 32px auto; padding: 0 16px; }

  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    padding: 28px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 1rem; color: #1F4E79; margin-bottom: 16px; font-weight: 700; }

  /* 탭 */
  .tabs { display: flex; gap: 0; border-bottom: 2px solid #e0e0e0; margin-bottom: 20px; }
  .tab {
    padding: 10px 24px;
    cursor: pointer;
    border: none;
    background: none;
    font-size: .95rem;
    color: #888;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all .2s;
  }
  .tab.active { color: #1F4E79; border-bottom-color: #1F4E79; font-weight: 700; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* 드롭존 */
  .dropzone {
    border: 2px dashed #b0c4de;
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    background: #f8fbff;
  }
  .dropzone:hover, .dropzone.drag-over { border-color: #2E75B6; background: #e8f0fb; }
  .dropzone svg { color: #2E75B6; margin-bottom: 10px; }
  .dropzone p { color: #555; font-size: .95rem; }
  .dropzone span { color: #2E75B6; font-weight: 600; }
  .dropzone small { display: block; color: #aaa; margin-top: 6px; font-size: .8rem; }
  #file-input { display: none; }
  #file-name {
    margin-top: 10px;
    font-size: .9rem;
    color: #2E75B6;
    font-weight: 600;
    min-height: 20px;
  }

  /* 텍스트 입력 */
  textarea {
    width: 100%;
    border: 1.5px solid #dde3ed;
    border-radius: 8px;
    padding: 14px;
    font-size: .9rem;
    line-height: 1.6;
    resize: vertical;
    min-height: 200px;
    font-family: inherit;
    transition: border-color .2s;
  }
  textarea:focus { outline: none; border-color: #2E75B6; }

  /* 버튼 */
  .btn-run {
    display: block;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1F4E79, #2E75B6);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s;
    margin-top: 16px;
  }
  .btn-run:hover { opacity: .9; }
  .btn-run:disabled { opacity: .5; cursor: not-allowed; }

  /* 진행 로그 */
  #log-section { display: none; }
  #log-box {
    background: #0d1117;
    color: #58d68d;
    font-family: 'Courier New', monospace;
    font-size: .82rem;
    padding: 16px;
    border-radius: 8px;
    height: 200px;
    overflow-y: auto;
    line-height: 1.7;
  }
  .log-line { white-space: pre-wrap; }
  .log-line.error { color: #e74c3c; }

  /* 진행바 */
  .progress-wrap { background: #e0e0e0; border-radius: 4px; height: 6px; margin: 12px 0; overflow: hidden; }
  .progress-bar  { background: #2E75B6; height: 100%; width: 0; transition: width .4s; border-radius: 4px; }

  /* 결과 */
  #result-section { display: none; }
  .result-actions { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn-action {
    padding: 9px 18px;
    border-radius: 7px;
    border: none;
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
  }
  .btn-dl   { background: #27ae60; color: #fff; }
  .btn-new  { background: #e0e0e0; color: #333; }
  .btn-action:hover { opacity: .85; }

  /* 대시보드 iframe */
  #dashboard-frame {
    width: 100%;
    height: 700px;
    border: 1.5px solid #dde3ed;
    border-radius: 8px;
  }

  /* 오류 */
  .error-box {
    background: #fdecea;
    border: 1.5px solid #e74c3c;
    border-radius: 8px;
    padding: 14px 18px;
    color: #c0392b;
    font-size: .9rem;
    display: none;
  }

  /* 스피너 */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
</style>
</head>
<body>

<header>
  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="16" y1="13" x2="8" y2="13"/>
    <line x1="16" y1="17" x2="8" y2="17"/>
    <polyline points="10 9 9 9 8 9"/>
  </svg>
  <div>
    <h1>요구사항 분석 에이전트</h1>
    <p>회의록을 업로드하면 요구사항 분석 보고서를 자동 생성합니다</p>
  </div>
</header>

<div class="container">

  <!-- 입력 카드 -->
  <div class="card" id="input-card">
    <h2>회의록 입력</h2>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('upload')">파일 업로드</button>
      <button class="tab"        onclick="switchTab('text')">텍스트 직접 입력</button>
    </div>

    <!-- 파일 업로드 탭 -->
    <div class="tab-panel active" id="tab-upload">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>파일을 드래그하거나 <span>클릭하여 선택</span></p>
        <small>지원 형식: .txt .docx .pdf .eml .md (최대 20MB)</small>
        <div id="file-name"></div>
      </div>
      <input type="file" id="file-input" accept=".txt,.docx,.pdf,.eml,.md">
    </div>

    <!-- 텍스트 탭 -->
    <div class="tab-panel" id="tab-text">
      <textarea id="text-input" placeholder="회의록 내용을 여기에 붙여넣기 하세요.

예시:
1. 현황 분석
디지털 자산이 여러 시스템에 분산 관리되어 검색이 어려움

2. 요구사항
시스템 구축을 통한 중앙화된 자산 관리 필요
..."></textarea>
    </div>

    <div class="error-box" id="error-box"></div>

    <button class="btn-run" id="btn-run" onclick="startAnalysis()">
      분석 시작
    </button>
  </div>

  <!-- 진행 로그 카드 -->
  <div class="card" id="log-section">
    <h2>분석 진행 상황</h2>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div id="log-box"></div>
  </div>

  <!-- 결과 카드 -->
  <div class="card" id="result-section">
    <h2>분석 결과</h2>
    <div class="result-actions">
      <button class="btn-action btn-dl"  id="btn-download" onclick="downloadXlsx()">XLSX 다운로드</button>
      <button class="btn-action btn-new" onclick="resetPage()">새 분석</button>
    </div>
    <iframe id="dashboard-frame" srcdoc=""></iframe>
  </div>

</div>

<script>
let currentJobId = null;
let activeTab = 'upload';

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'upload') || (i === 1 && tab === 'text'));
  });
  document.getElementById('tab-upload').classList.toggle('active', tab === 'upload');
  document.getElementById('tab-text').classList.toggle('active', tab === 'text');
}

// 드래그&드롭
const dropzone = document.getElementById('dropzone');
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) setFile(file);
});
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) setFile(e.target.files[0]);
});

function setFile(file) {
  document.getElementById('file-name').textContent = '선택된 파일: ' + file.name;
  document.getElementById('file-input')._file = file;
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}

function hideError() {
  document.getElementById('error-box').style.display = 'none';
}

async function startAnalysis() {
  hideError();
  const btn = document.getElementById('btn-run');
  const formData = new FormData();

  if (activeTab === 'upload') {
    const input = document.getElementById('file-input');
    const file = input._file || (input.files && input.files[0]);
    if (!file) { showError('파일을 선택해 주세요.'); return; }
    formData.append('file', file);
  } else {
    const text = document.getElementById('text-input').value.trim();
    if (!text) { showError('회의록 내용을 입력해 주세요.'); return; }
    formData.append('text', text);
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>분석 중...';

  const logSection = document.getElementById('log-section');
  const logBox = document.getElementById('log-box');
  logSection.style.display = 'block';
  logBox.innerHTML = '';
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('progress-bar').style.width = '5%';

  try {
    const res = await fetch('/analyze', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok || data.error) { showError(data.error || '서버 오류'); resetBtn(); return; }

    currentJobId = data.job_id;
    pollStatus(currentJobId, 0);
  } catch (e) {
    showError('서버 연결 실패: ' + e.message);
    resetBtn();
  }
}

async function pollStatus(jid, prevLogCount) {
  try {
    const res = await fetch('/status/' + jid);
    if (!res.ok) { showError('상태 확인 실패'); resetBtn(); return; }
    const data = await res.json();

    const logBox = document.getElementById('log-box');
    const bar = document.getElementById('progress-bar');
    const steps = ['Step 1', 'Step 2', 'Step 3', 'Step 4'];

    // 새 로그 줄만 추가
    const logs = data.logs || [];
    for (let i = prevLogCount; i < logs.length; i++) {
      const line = document.createElement('div');
      line.className = 'log-line' + (logs[i].includes('[오류]') ? ' error' : '');
      line.textContent = logs[i];
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // 진행바 업데이트
    const lastLog = logs[logs.length - 1] || '';
    const stepIdx = steps.reduce((acc, s, i) => lastLog.includes(s) ? i : acc, -1);
    if (stepIdx >= 0) bar.style.width = ((stepIdx + 1) / steps.length * 90) + '%';

    if (data.status === 'running') {
      setTimeout(() => pollStatus(jid, logs.length), 1500);
      return;
    }

    bar.style.width = '100%';
    resetBtn();

    if (data.status === 'error') {
      showError('분석 오류: ' + data.message);
      return;
    }

    // done
    document.getElementById('result-section').style.display = 'block';
    document.getElementById('dashboard-frame').srcdoc = data.dashboard_html;
    window.scrollTo({ top: document.getElementById('result-section').offsetTop - 20, behavior: 'smooth' });

  } catch (e) {
    showError('서버 연결 오류: ' + e.message);
    resetBtn();
  }
}

async function loadResult(jid) {
  const res = await fetch('/status/' + jid);
  const data = await res.json();
  resetBtn();

  if (data.status === 'error') {
    showError('분석 오류: ' + data.message);
    return;
  }
  if (data.status !== 'done') {
    showError('결과를 불러올 수 없습니다.');
    return;
  }

  document.getElementById('result-section').style.display = 'block';
  document.getElementById('dashboard-frame').srcdoc = data.dashboard_html;
  document.getElementById('btn-download').dataset.jid = jid;
  window.scrollTo({ top: document.getElementById('result-section').offsetTop - 20, behavior: 'smooth' });
}

function downloadXlsx() {
  const jid = currentJobId;
  if (jid) window.location.href = '/download/' + jid;
}

function resetBtn() {
  const btn = document.getElementById('btn-run');
  btn.disabled = false;
  btn.innerHTML = '분석 시작';
}

function resetPage() {
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('log-section').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0';
  document.getElementById('file-name').textContent = '';
  document.getElementById('text-input').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('file-input')._file = null;
  hideError();
  resetBtn();
  currentJobId = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
