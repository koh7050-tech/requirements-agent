<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요구사항 분석 에이전트</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0d0d;
    --surface:   #161616;
    --surface2:  #1e1e1e;
    --border:    #2a2a2a;
    --border2:   #333;
    --text:      #f0f0f0;
    --muted:     #888;
    --accent:    #ffffff;
    --green:     #3ecf8e;
    --red:       #f04040;
    --radius:    10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 56px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13,13,13,.92);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -.3px;
  }
  .logo svg { color: var(--green); }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border: 1px solid var(--border2);
    border-radius: 20px;
    color: var(--muted);
    font-weight: 500;
  }

  /* ── 히어로 ── */
  .hero {
    padding: 72px 32px 48px;
    max-width: 760px;
    margin: 0 auto;
  }
  .hero h1 {
    font-size: 2.6rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -.5px;
    margin-bottom: 16px;
  }
  .hero p {
    font-size: 1.05rem;
    color: var(--muted);
    max-width: 520px;
    line-height: 1.7;
  }

  /* ── 메인 컨테이너 ── */
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 32px 80px;
  }

  /* ── 카드 ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* ── 탭 ── */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .tab {
    padding: 8px 18px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }
  .tab:hover:not(.active) { color: #ccc; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── 드롭존 ── */
  .dropzone {
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    background: var(--surface2);
    transition: border-color .2s, background .2s;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: #555;
    background: #222;
  }
  .dropzone svg { color: var(--muted); margin-bottom: 12px; }
  .dropzone p { color: var(--muted); font-size: 13px; }
  .dropzone span { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .dropzone small { display: block; color: #555; margin-top: 6px; font-size: 11px; }
  #file-input { display: none; }
  #file-name {
    margin-top: 12px;
    font-size: 12px;
    color: var(--green);
    font-weight: 500;
    min-height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* ── 텍스트 입력 ── */
  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.7;
    resize: vertical;
    min-height: 200px;
    font-family: inherit;
    transition: border-color .2s;
  }
  textarea::placeholder { color: #444; }
  textarea:focus { outline: none; border-color: #444; }

  /* ── 버튼 ── */
  .btn-run {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
    transition: opacity .15s;
    letter-spacing: .2px;
  }
  .btn-run:hover { opacity: .88; }
  .btn-run:disabled { opacity: .3; cursor: not-allowed; }

  /* ── 오류 ── */
  .error-box {
    background: rgba(240,64,64,.08);
    border: 1px solid rgba(240,64,64,.3);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: #f07070;
    font-size: 12px;
    display: none;
    margin-top: 12px;
  }

  /* ── 로그 ── */
  #log-section { display: none; }
  .log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .log-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .dot.done { background: var(--green); animation: none; }
  .dot.error { background: var(--red); animation: none; }

  .progress-wrap {
    background: var(--border);
    border-radius: 2px;
    height: 2px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .progress-bar {
    background: var(--green);
    height: 100%;
    width: 0;
    transition: width .5s ease;
    border-radius: 2px;
  }

  #log-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    height: 220px;
    overflow-y: auto;
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 11.5px;
    line-height: 1.8;
    color: #aaa;
  }
  #log-box::-webkit-scrollbar { width: 4px; }
  #log-box::-webkit-scrollbar-track { background: transparent; }
  #log-box::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .log-line { white-space: pre-wrap; }
  .log-line.ok   { color: var(--green); }
  .log-line.error { color: var(--red); }
  .log-line.head  { color: #ddd; font-weight: 600; }

  /* ── 결과 ── */
  #result-section { display: none; }
  .result-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .btn-sm {
    padding: 7px 16px;
    border-radius: 7px;
    border: 1px solid var(--border2);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    background: var(--surface2);
    color: var(--text);
  }
  .btn-sm:hover { background: var(--surface); border-color: #555; }
  .btn-sm.primary {
    background: var(--green);
    color: #000;
    border-color: var(--green);
  }
  .btn-sm.primary:hover { opacity: .85; }

  #dashboard-frame {
    width: 100%;
    height: 680px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
  }

  /* ── 스피너 ── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,.2);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    flex-shrink: 0;
  }

  /* ── 태그 ── */
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .tag {
    font-size: 11px;
    padding: 3px 10px;
    border: 1px solid var(--border2);
    border-radius: 20px;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    .hero { padding: 48px 20px 32px; }
    .hero h1 { font-size: 1.9rem; }
    .container { padding: 0 20px 60px; }
    header { padding: 0 20px; }
  }
</style>
</head>
<body>

<!-- 헤더 -->
<header>
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
    </svg>
    요구사항 분석 에이전트
  </div>
  <span class="badge">Beta</span>
</header>

<!-- 히어로 -->
<div class="hero">
  <h1>회의록을 요구사항으로,<br>자동으로.</h1>
  <p>문서를 업로드하거나 텍스트를 붙여넣으면 FR·NFR·KPI·액션 플랜을 자동으로 추출해 대시보드와 XLSX로 제공합니다.</p>
  <div class="tags">
    <span class="tag">.txt</span>
    <span class="tag">.docx</span>
    <span class="tag">.pdf</span>
    <span class="tag">.eml</span>
    <span class="tag">.md</span>
    <span class="tag">텍스트 입력</span>
  </div>
</div>

<!-- 메인 -->
<div class="container">

  <!-- 입력 카드 -->
  <div class="card" id="input-card">
    <div class="card-label">회의록 입력</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('upload')">파일 업로드</button>
      <button class="tab"        onclick="switchTab('text')">텍스트 입력</button>
    </div>

    <div class="tab-panel active" id="tab-upload">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>파일을 드래그하거나 <span>클릭하여 선택</span></p>
        <small>최대 20MB · txt, docx, pdf, eml, md</small>
        <div id="file-name"></div>
      </div>
      <input type="file" id="file-input" accept=".txt,.docx,.pdf,.eml,.md">
    </div>

    <div class="tab-panel" id="tab-text">
      <textarea id="text-input" placeholder="회의록 내용을 붙여넣기 하세요.

예시:
1. 현황 분석
디지털 자산이 여러 시스템에 분산 관리되어 검색이 어려움

2. 요구사항
시스템 구축을 통한 중앙화된 자산 관리 필요
..."></textarea>
    </div>

    <div class="error-box" id="error-box"></div>

    <button class="btn-run" id="btn-run" onclick="startAnalysis()">
      분석 시작
    </button>
  </div>

  <!-- 로그 카드 -->
  <div class="card" id="log-section">
    <div class="log-header">
      <div class="card-label" style="margin:0">분석 진행 상황</div>
      <div class="log-status">
        <div class="dot" id="dot"></div>
        <span id="status-text">처리 중...</span>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div id="log-box"></div>
  </div>

  <!-- 결과 카드 -->
  <div class="card" id="result-section">
    <div class="log-header">
      <div class="card-label" style="margin:0">분석 결과</div>
      <div class="result-actions">
        <button class="btn-sm primary" onclick="downloadXlsx()">XLSX 다운로드</button>
        <button class="btn-sm" onclick="resetPage()">새 분석</button>
      </div>
    </div>
    <iframe id="dashboard-frame" srcdoc=""></iframe>
  </div>

</div>

<script>
let currentJobId = null;
let activeTab = 'upload';

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'upload') || (i === 1 && tab === 'text'));
  });
  document.getElementById('tab-upload').classList.toggle('active', tab === 'upload');
  document.getElementById('tab-text').classList.toggle('active', tab === 'text');
}

const dropzone = document.getElementById('dropzone');
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) setFile(file);
});
document.getElementById('file-input').addEventListener('change', e => {
  if (e.target.files[0]) setFile(e.target.files[0]);
});

function setFile(file) {
  const el = document.getElementById('file-name');
  el.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3ecf8e" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> ${file.name}`;
  document.getElementById('file-input')._file = file;
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}
function hideError() { document.getElementById('error-box').style.display = 'none'; }

async function startAnalysis() {
  hideError();
  const btn = document.getElementById('btn-run');
  const formData = new FormData();

  if (activeTab === 'upload') {
    const input = document.getElementById('file-input');
    const file = input._file || (input.files && input.files[0]);
    if (!file) { showError('파일을 선택해 주세요.'); return; }
    formData.append('file', file);
  } else {
    const text = document.getElementById('text-input').value.trim();
    if (!text) { showError('회의록 내용을 입력해 주세요.'); return; }
    formData.append('text', text);
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> 분석 중...';

  document.getElementById('log-section').style.display = 'block';
  document.getElementById('log-box').innerHTML = '';
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('progress-bar').style.width = '4%';
  document.getElementById('dot').className = 'dot';
  document.getElementById('status-text').textContent = '처리 중...';

  try {
    const res = await fetch('/analyze', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok || data.error) { showError(data.error || '서버 오류'); resetBtn(); return; }
    currentJobId = data.job_id;
    pollStatus(currentJobId, 0);
  } catch (e) {
    showError('서버 연결 실패: ' + e.message);
    resetBtn();
  }
}

async function pollStatus(jid, prevLogCount) {
  try {
    const res = await fetch('/status/' + jid);
    if (!res.ok) { showError('상태 확인 실패 (서버 오류)'); resetBtn(); return; }
    const data = await res.json();

    const logBox = document.getElementById('log-box');
    const bar = document.getElementById('progress-bar');
    const steps = ['Step 1', 'Step 2', 'Step 3', 'Step 4'];

    const logs = data.logs || [];
    for (let i = prevLogCount; i < logs.length; i++) {
      const line = document.createElement('div');
      const msg = logs[i];
      let cls = 'log-line';
      if (msg.includes('[오류]')) cls += ' error';
      else if (msg.includes('완료') || msg.includes('PASS')) cls += ' ok';
      else if (msg.includes('===')) cls += ' head';
      line.className = cls;
      line.textContent = msg;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    const lastLog = logs[logs.length - 1] || '';
    const stepIdx = steps.reduce((acc, s, i) => lastLog.includes(s) ? i : acc, -1);
    if (stepIdx >= 0) bar.style.width = ((stepIdx + 1) / steps.length * 90) + '%';

    if (data.status === 'running') {
      setTimeout(() => pollStatus(jid, logs.length), 1500);
      return;
    }

    bar.style.width = '100%';
    resetBtn();

    if (data.status === 'error') {
      document.getElementById('dot').className = 'dot error';
      document.getElementById('status-text').textContent = '오류 발생';
      showError('분석 오류: ' + (data.message || '알 수 없는 오류'));
      return;
    }

    document.getElementById('dot').className = 'dot done';
    document.getElementById('status-text').textContent = '완료';
    document.getElementById('result-section').style.display = 'block';
    document.getElementById('dashboard-frame').srcdoc = data.dashboard_html;
    window.scrollTo({ top: document.getElementById('result-section').offsetTop - 20, behavior: 'smooth' });

  } catch (e) {
    showError('네트워크 오류: ' + e.message);
    resetBtn();
  }
}

function downloadXlsx() {
  if (currentJobId) window.location.href = '/download/' + currentJobId;
}

function resetBtn() {
  const btn = document.getElementById('btn-run');
  btn.disabled = false;
  btn.innerHTML = '분석 시작';
}

function resetPage() {
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('log-section').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0';
  document.getElementById('file-name').innerHTML = '';
  document.getElementById('text-input').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('file-input')._file = null;
  hideError();
  resetBtn();
  currentJobId = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
